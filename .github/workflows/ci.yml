name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  IMAGE: ghcr.io/commsecurityau/cs-ops
  # Image budget is 75 MB against an expected ~60 (§14). A 2x headroom gate
  # catches nothing -- it only fires long after the drift it exists to
  # prevent has already happened.
  MAX_IMAGE_BYTES: 78643200

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # N-1 check needs the previous release tag

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Timed HERE, once. An earlier version ran the whole suite a second
      # time purely to measure it, so every build paid for two runs and the
      # number described a run nobody looked at.
      #
      # OPS_SCHEMA_CACHE: applying twenty-four migrations costs 65 ms and
      # copying the result costs 3 ms, which is 45 s of a 75 s run.
      - name: Suite
        run: |
          start=$(date +%s%N)
          OPS_SCHEMA_CACHE=/tmp/ops-schema \
            python3 -W error::ResourceWarning -m unittest discover -s tests -v
          echo $(( ($(date +%s%N) - start) / 1000000 )) > /tmp/suite_ms

      # The gates are unittest cases, so they already ran above. This step
      # exists to name them separately in the CI log -- when a build goes
      # red, "gates" and "tests" are different conversations.
      - name: Gates (deps, secrets, base image pin, migrations)
        run: python3 -m unittest tests.test_gates -v

      # ADR-19: a HARD gate. Note there is no `|| true` and no second
      # invocation -- an earlier version ran pyright twice so the step's exit
      # code came from the retry, which is a gate that cannot fail.
      - name: Types (pyright --strict, 0 errors)
        run: |
          pip install pyright==1.1.389
          pyright

      # A BUDGET, not a wish. 10 s was set when the suite was a few dozen
      # tests and was already unreachable at 382; it failed for the first
      # time at 977 only because CI hardware had been carrying it.
      #
      # These are not unit tests in the usual sense: each one migrates a
      # real database and most boot a real HTTP server, because this
      # platform does not mock the things most likely to break. That costs
      # about 90 ms a test, of which 65 ms is applying 24 migrations.
      #
      # 60 s at 979 tests, with the schema cache on. The migration cost is
      # already taken; the rest is booting real HTTP servers, which is what
      # these tests are for.
      #
      # **Do not raise this. The next lever is the server boot per test,
      # not a larger number here.**
      - name: Suite wall time under 60 s
        run: |
          ms=$(cat /tmp/suite_ms)
          echo "suite: ${ms} ms"
          test "$ms" -lt 60000 || {
            echo "suite exceeded the 60 s budget"
            echo "Do NOT raise this number."
            echo "  Is OPS_SCHEMA_CACHE set? Without it the suite is 2.5x."
            echo "  Otherwise the lever is the HTTP server booted per test."
            exit 1
          }

  n1:
    # A migration must not break the PREVIOUS release's code, because
    # rollback is automatic and nothing rolls the schema back for you.
    # This makes N-1 a gate rather than a discipline to remember.
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Previous release tests against the new schema head
        run: |
          prev=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$prev" ]; then echo "no release tag yet; N-1 not applicable"; exit 0; fi
          echo "checking $prev against the new migration head"
          mkdir -p /tmp/head && cp -r ops/migrations /tmp/head/
          git checkout --quiet "$prev"
          rm -rf ops/migrations && cp -r /tmp/head/migrations ops/

          # Retried once. The old tag's tests are frozen, so any flakiness
          # they had at release time cannot be fixed -- only tolerated.
          if python3 -W error::ResourceWarning -m unittest discover -s tests; then
            exit 0
          fi
          echo "::warning::N-1 first attempt failed; retrying once"
          if python3 -W error::ResourceWarning -m unittest discover -s tests; then
            exit 0
          fi

          cat <<'TRIAGE'

          ============================================================
          N-1 FAILED. Before assuming the migration is unsafe, note that
          this runs the OLD TAG'S TESTS, which are frozen. There are three
          reasons they can fail, and only one is a real problem:

          1. REAL INCOMPATIBILITY -- the new schema breaks the previous
             release's code. This is what the gate is for. Fix the
             migration: expand, do not contract.

          2. THE OLD TEST ASSERTED ON SCHEMA INVENTORY -- e.g. a hardcoded
             list of migration filenames. The code is fine; the test was
             over-specific about a thing that legitimately changed.

          3. THE OLD TEST WAS FLAKY at the time it was tagged.

          For 2 and 3 the fix is to TAG A NEW RELEASE from a commit whose
          tests are correct, so the next N-1 run has a healthy baseline.
          Confirm case 1 is excluded by checking the migration is
          expand-only (ADD COLUMN / CREATE, no DROP or type change) and
          that the previous release's queries still run against it.
          ============================================================
          TRIAGE
          exit 1

  image:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Build (retry transient pulls -- red CI must mean OUR code broke)
        run: |
          for i in 1 2 3; do
            docker build -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" . && break
            echo "build attempt $i failed"; sleep 5
          done
          docker image inspect "$IMAGE:${GITHUB_SHA::7}" >/dev/null

      - name: In-image assertions
        run: |
          docker run --rm "$IMAGE:${GITHUB_SHA::7}" python3 -c "
          import sqlite3, sys, os
          v = tuple(int(p) for p in sqlite3.sqlite_version.split('.'))
          assert v >= (3, 37, 0), f'SQLite {sqlite3.sqlite_version} < 3.37'
          # auth.py trusts TLS alone for an unsigned id_token payload, so a
          # missing trust store silently removes the entire trust boundary.
          assert os.path.exists('/etc/ssl/certs/ca-certificates.crt'), 'no CA bundle'
          print('sqlite', sqlite3.sqlite_version, '| ca bundle present')
          "
      - name: Zero pip packages beyond the base
        run: |
          n=$(docker run --rm "$IMAGE:${GITHUB_SHA::7}" pip list --format=freeze | wc -l)
          echo "pip packages: $n"
          test "$n" -le 3 || { docker run --rm "$IMAGE:${GITHUB_SHA::7}" pip list; exit 1; }

      - name: Smoke test the real entrypoint
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e OPS_TLS=off -e OPS_PORT=8080 \
            -e OIDC_CLIENT_ID=ci -e OIDC_REDIRECT_URI=http://localhost:8080/auth/callback \
            -e OPS_SECRETS_PATH=/data/secrets/store.json \
            "$IMAGE:${GITHUB_SHA::7}" sh -c \
            "printf ci-secret | python3 -m ops.secrets set OIDC_CLIENT_SECRET && python3 -m ops.main"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/healthz || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          docker logs smoke
          test "$code" = "200" || { echo "healthz never returned 200"; exit 1; }
          docker rm -f smoke

      - name: Size gate
        run: |
          bytes=$(docker image inspect "$IMAGE:${GITHUB_SHA::7}" --format='{{.Size}}')
          echo "image: $((bytes / 1048576)) MB (limit $((MAX_IMAGE_BYTES / 1048576)) MB)"
          test "$bytes" -lt "$MAX_IMAGE_BYTES" || exit 1

      - name: Push
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
