# CS-OP on the internal VM (CS-OP-RUN-002).
#
# ONE service, ONE volume, no reverse proxy, no sidecar. The application
# terminates TLS itself and serves its own static files, so there is nothing
# between it and the network to misconfigure -- and nothing else to patch.
#
# BY DIGEST, NOT BY TAG. `latest` moves on every push to main: it moved from
# a tested build to an untested one within the hour on 3 September, over a
# `.gitignore` commit. A restart six weeks from now must bring back the
# bytes that were running, not whatever has been merged since. Upgrading is
# then a deliberate act -- change the digest, `up -d`, and roll back by
# putting the old digest back.
#
# ALL CONFIGURATION COMES FROM .env, next to this file. Raven-Fleet writes
# it from the release's environment-variable JSON; Compose reads it and
# substitutes the ${...} references below. Nothing in this file is
# host-specific, so this file is in git and .env is not (see .gitignore).
# Every reference uses ${VAR:?}, so a missing key fails `up` with the key's
# name rather than starting a container that cannot sign anyone in.
#
# THE OIDC SECRET IS AN ENVIRONMENT VARIABLE, set from .env. That is a
# deliberate trade: it is readable by anyone who can run `docker inspect`
# on the VM, which is the same set of people who can read the volume, and
# it means a restore does not need the secret store re-seeded by hand
# (CS-OP-RUN-001). Keep .env 0600. If OIDC_CLIENT_SECRET is left out the
# app falls back to `secret://OIDC_CLIENT_SECRET` in the store on the
# volume, so the old mechanism still works if you want it back.
#
# THE CERTIFICATE travels the same way, as OPS_TLS_CERT and OPS_TLS_KEY in
# the release JSON: base64 of the PEM files issued by the internal CA for
# ops.commsecurity.com.au. The app writes them to data/tls/ at boot, key
# 0600, before it checks them. Renewal is a new release with new values,
# not a login to the VM. The pair is NOT in the image: an image is pulled
# by every host and kept forever in the registry, which is no place for a
# private key. The app refuses to serve without a valid pair rather than
# falling back to plaintext, which is the behaviour you want.
#
#   Produce the values:
#     base64 -w0 server.crt
#     base64 -w0 server.key

services:
  cs-ops:
    #image: ghcr.io/commsecurityau/cs-ops@sha256:f818ecee19e22a8d1f409ecae5943d05ab16abedad54f5ec72710e27271df179
    image: commsecurityau/cs-ops:latest
    container_name: cs-ops
    restart: unless-stopped

    environment:
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
      OPS_PORT: ${OPS_PORT:?}
      OPS_TLS: ${OPS_TLS:?}
      OPS_HOSTED_DOMAIN: ${OPS_HOSTED_DOMAIN:?}
      OPS_BACKUP_INTERVAL_S: ${OPS_BACKUP_INTERVAL_S:?}
      OPS_BACKUP_KEEP: ${OPS_BACKUP_KEEP:?}
      # Optional. Base64 of the PEM files; the app writes them to
      # data/tls/ at boot. Leave both out to use a pair already on the
      # volume. One without the other is refused.
      OPS_TLS_CERT: ${OPS_TLS_CERT:-}
      OPS_TLS_KEY: ${OPS_TLS_KEY:-}

    # A BIND MOUNT, not a named volume. The snapshots have to be reachable
    # by the off-box sync running on the host, and a named volume puts them
    # somewhere only Docker knows about.
    volumes:
      - ./data:/data

    ports:
      # Bound to all interfaces, but the VM is on 172.16/12 and reachable
      # only over the VPN. If that ever changes, this line is the one to
      # revisit first.
      - "8443:8443"

    # The app is single-process Python with SQLite; it does not need a
    # gigabyte. A limit means a runaway query is a slow request rather than
    # a VM that stops responding to SSH.
    mem_limit: 1g
    pids_limit: 256

    # Nothing in here writes outside /data.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # `python3 -m ops.main` is PID 1 and handles SIGTERM directly, so a
    # normal stop takes milliseconds rather than the default 10 s timeout.
    stop_grace_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
